# Home Assistant — generic base configuration for the UNO Q voice hub.
# default_config already enables Assist, the Wyoming integration, cameras,
# media players, MQTT discovery via the UI, etc.

default_config:

homeassistant:
  name: UNO Q Home
  # Set your location, unit system and timezone during onboarding or here.
  # latitude: !secret home_latitude
  # longitude: !secret home_longitude

# Reverse-proxy friendliness (harmless with host networking).
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Text-to-speech shorthand so scripts/automations can call tts.speak.
tts:
  - platform: piper

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
