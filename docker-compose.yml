# Home Assistant voice hub for the Arduino UNO Q
#
# Core services (always on):  homeassistant, whisper, piper, openwakeword
# Optional camera profile:    go2rtc   ->  docker compose --profile camera up -d
#
# The wyoming-satellite (mic + speaker) runs NATIVELY on the UNO Q, not here,
# because it needs direct access to the audio hardware. See wyoming-satellite/.

name: unoq-home-assistant

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro

  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-tiny-int8} --language en --beam-size 1
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./data/whisper:/data
    ports:
      - "10300:10300"

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-en_GB-alba-medium}
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./data/piper:/data
    ports:
      - "10200:10200"

  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    command: --preload-model ${WAKEWORD:-ok_nabu}
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./data/openwakeword:/data
    ports:
      - "10400:10400"

  # ---- Optional USB camera (docker compose --profile camera up -d) ----
  go2rtc:
    container_name: go2rtc
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    profiles: ["camera"]
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ:-Etc/UTC}
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}
    volumes:
      - ./camera/go2rtc.yaml:/config/go2rtc.yaml:ro
